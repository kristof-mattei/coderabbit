# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  review_status: false
  auto_review:
    ignore_title_keywords:
      # release PRs opened from `release/v*` branches
      - "chore(release):"
    ignore_usernames:
      - "renovate[bot]"
  pre_merge_checks:
    docstrings:
      mode: "off"
